{% extends "base.html" %}
{% block title %}Supplier Report — Pharmtech POS{% endblock %}
{% block page_title %}Supplier Report{% endblock %}
{% block content %}
<div class="card mb-4" style="overflow: visible;">
  <div class="card-header"><h2>Filter</h2></div>
  <div class="card-body" style="overflow: visible;">
    <form hx-get="{% url 'supplier-report' %}"
      hx-target="#report-results"
      hx-swap="innerHTML"
      class="flex gap-3 items-center">
      <div class="form-group" style="margin:0">
        <input type="date" name="start_date" class="form-input" value="{{ start_date }}" required>
      </div>
      <span class="text-muted">to</span>
      <div class="form-group" style="margin:0">
        <input type="date" name="end_date" class="form-input" value="{{ end_date }}" required>
      </div>
      <div class="form-group" style="margin:0; width:220px;">
        <select name="supplier_id" class="form-input search-select">
          <option value="all">All Suppliers</option>
          {% for s in suppliers %}
          <option value="{{ s.id }}" {% if supplier_id == s.id|stringformat:"s" %}selected{% endif %}>{{ s.name }}</option>
          {% endfor %}
        </select>
      </div>
      <button type="submit" class="btn btn-primary">Generate</button>
    </form>
  </div>
</div>
<div id="report-results">{% include "reports/partials/_supplier_table.html" %}</div>
{% endblock %}
