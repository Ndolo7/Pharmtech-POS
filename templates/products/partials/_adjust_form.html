<div class="modal-backdrop" x-data @click.self="document.getElementById('modal-container').innerHTML=''">
  <div class="modal">
    <div class="modal-header">
      <h3>Adjust Stock — {{ product.name }}</h3>
      <button class="btn-icon" onclick="document.getElementById('modal-container').innerHTML=''">✕</button>
    </div>
    <div class="modal-body">
      <p class="text-muted text-sm mb-4">
        Current stock: <strong>{{ current_stock }}</strong>
        {% if active_branch %} for <strong>{{ active_branch.name }}</strong>{% endif %}
      </p>
      <form method="post"
        hx-post="{% url 'adjust-stock' product.pk %}"
        hx-swap="none"
        hx-on::after-request="if(event.detail.successful) document.getElementById('modal-container').innerHTML=''">
        {% csrf_token %}
        {% if active_branch_id %}<input type="hidden" name="branch_id" value="{{ active_branch_id }}">{% endif %}
        <div class="form-group">
          <label>New Quantity *</label>
          {{ form.new_quantity }}
        </div>
        <div class="form-group">
          <label>Reason *</label>
          {{ form.reason }}
        </div>
        {% if form.errors %}
        <div class="message message-error">{{ form.errors }}</div>
        {% endif %}
        <div class="modal-footer" style="padding:0;margin-top:16px">
          <button type="button" class="btn btn-secondary" onclick="document.getElementById('modal-container').innerHTML=''">Cancel</button>
          <button type="submit" class="btn btn-primary">Adjust Stock</button>
        </div>
      </form>
    </div>
  </div>
</div>
