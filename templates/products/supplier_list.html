{% extends "base.html" %}
{% block title %}Suppliers — Pharmtech POS{% endblock %}
{% block page_title %}Suppliers{% endblock %}

{% block content %}
<div class="flex justify-between items-center mb-4">
  <a class="btn btn-secondary" href="{% url 'product-list' %}">Back to Products</a>
  <button class="btn btn-primary"
    hx-get="{% url 'supplier-create' %}"
    hx-target="#modal-container"
    hx-swap="innerHTML">
    + Add Supplier
  </button>
</div>

<div class="card">
  <div id="supplier-table-container">
    {% include "products/partials/_supplier_table.html" %}
  </div>
</div>

<div id="modal-container"></div>
{% endblock %}
