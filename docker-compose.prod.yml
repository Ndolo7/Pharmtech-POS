services:
  web:
    image: ghcr.io/ndolo7/pharmtech-pos:latest
    command: gunicorn pos_system.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 4 --access-logfile - --access-logformat '"%(r)s" %(s)s %(B)s' --error-logfile - --capture-output --log-level info
    restart: always
    volumes:
      - static_volume:/app/staticfiles
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  db:
    image: postgres:16-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - .env

  redis:
    image: redis:7-alpine
    restart: always

  worker:
    image: ghcr.io/ndolo7/pharmtech-pos:latest
    command: celery -A pos_system worker -l info
    restart: on-failure
    env_file:
      - .env
    depends_on:
      - web
      - redis
      - db

  beat:
    image: ghcr.io/ndolo7/pharmtech-pos:latest
    command: celery -A pos_system beat -l info
    restart: on-failure
    env_file:
      - .env
    depends_on:
      - web
      - redis
      - db

volumes:
  postgres_data:
  static_volume:
